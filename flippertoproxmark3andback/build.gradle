 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'com.diffplug.spotless' version '8.10.4'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    // flatDir {
    //     dirs 'libs'
    // }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'

    // This dependency is used by the application.
    implementation 'com.google.guava:guava:33.7.2-jre'
    // https://mvnrepository.com/artifact/com.googlecode.json-simple/json-simple
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    //implementation files('libs/json-simple-1.1.1.jar');
}

application {
    // Define the main class for the application.
    mainClass = 'flippertoproxmark3andback.NfcDumpConverter'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 27
    options.compilerArgs += ['-Xlint:unchecked']
}

spotless {
    java {
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        // Use the default importOrder configuration
        importOrder()
        forbidWildcardImports() // or expandWildcardImports, see below
        forbidModuleImports()
        shortenFullyQualifiedTypes() // replaces fully-qualified type names with simple names + imports
        // Cleanthat will refactor your code, but it may break your style: apply it before your formatter
        cleanthat()          // has its own section below
        prettier(['prettier': '3.9.10', 'prettier-plugin-java': '2.11.0'])
            .config(['parser': 'java', 'tabWidth': 2, 'plugins': ['prettier-plugin-java']])
        tableTestFormatter() // has its own section below
        formatAnnotations()  // fixes formatting of type annotations, see below
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}

jar {
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

